name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          set -eu
          V=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o gitleaks.tgz "${BASE}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${BASE}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | awk '{print $1"  gitleaks.tgz"}' | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the whole history for secrets
        run: ./gitleaks git --redact -v

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format check
        run: docker run --rm -v "$PWD:/work" -w /work/infra hashicorp/terraform:1.17.1 fmt -check -recursive
      - name: Validate
        run: |
          docker run --rm -v "$PWD:/work" -w /work/infra hashicorp/terraform:1.17.1 init -backend=false
          docker run --rm -v "$PWD:/work" -w /work/infra hashicorp/terraform:1.17.1 validate

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: helm version
      - run: helm lint deploy/charts/hello
      - run: helm lint deploy/bootstrap

  compliance-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-throwaway-admin
          POSTGRES_DB: compliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the API tests, including the audit database tests
        working-directory: app/compliance
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:ci-throwaway-admin@localhost:5432/compliance
          APP_PASSWORD: ci-throwaway-app
          TEST_DATABASE_URL: postgresql://compliance_app:ci-throwaway-app@localhost:5432/compliance
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          python db/apply_schema.py
          pytest -q

  ui-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the UI tests
        working-directory: app/ui
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pytest -q
      - name: Run the web page logic tests
        working-directory: app/compliance/web
        run: node --test

  compliance-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nisha1805/gatekeeper-compliance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t "$IMAGE:ci" app/compliance
      - name: Check that it runs as a non-root user
        run: |
          set -eu
          uid=$(docker run --rm --entrypoint id "$IMAGE:ci" -u)
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Start it and check that it answers
        run: |
          set -eu
          docker run -d --name compliance -p 8000:8000 "$IMAGE:ci"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then echo; break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/app/)" = "200"
          docker logs compliance
          docker rm -f compliance
      - name: Push to GHCR (main only, tagged with the commit)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="sha-${GITHUB_SHA::12}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:ci" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$TAG"
