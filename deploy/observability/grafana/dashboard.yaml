apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gatekeeper
  namespace: observability
data:
  gatekeeper.json: |
    {
      "uid": "gatekeeper-overview",
      "title": "Gatekeeper gateway",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Chat success rate (SLO 99%)",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "refId": "A", "expr": "gatekeeper:chat_success_ratio:rate5m" } ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "red", "value": null },
              { "color": "orange", "value": 0.95 },
              { "color": "green", "value": 0.99 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" }
        },
        {
          "id": 2, "type": "stat", "title": "Gateway metrics target",
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "refId": "A", "expr": "up{job=\"litellm\"}" } ],
          "fieldConfig": { "defaults": {
            "mappings": [ { "type": "value", "options": {
              "1": { "text": "UP", "color": "green" },
              "0": { "text": "DOWN", "color": "red" } } } ] }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" }
        },
        {
          "id": 3, "type": "stat", "title": "Backup model answers (last 5 min)",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "refId": "A", "expr": "sum(increase(litellm_deployment_successful_fallbacks_total[5m])) or vector(0)" } ],
          "fieldConfig": { "defaults": { "decimals": 0,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "orange", "value": 1 } ] } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" }
        },
        {
          "id": 4, "type": "timeseries", "title": "Chat requests per second, by model",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "refId": "A", "legendFormat": "{{requested_model}}",
            "expr": "sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total{route=\"/v1/chat/completions\"}[5m]))" } ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        }
      ]
    }