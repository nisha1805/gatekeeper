# Creates the app role and the append-only tables. Safe to run again.
# Runs after Postgres is ready (wave 1) and before the service starts (wave 2).
apiVersion: batch/v1
kind: Job
metadata:
  name: compliance-schema
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "db/apply_schema.py"]
          env:
            - name: ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: ADMIN_DATABASE_URL
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: APP_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
